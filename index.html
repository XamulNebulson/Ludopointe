<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ludopointe</title>
  <meta name="description" content="Pointage des employés de la ludothèque.">
  <meta name="theme-color" content="#f3ecdd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e2024" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/icone-apple-180.png">
  <meta name="apple-mobile-web-app-title" content="Ludopointe">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg hidden aria-hidden="true">
    <symbol id="i-pion" viewBox="0 0 24 24">
      <path d="M12 2a3.3 3.3 0 0 1 2.9 4.9c2.9.9 5.6 2.6 5.6 4.3 0 1.3-1.7 1.4-3.7.9l2.5 8.6a1 1 0 0 1-1 1.3h-3.6a1 1 0 0 1-.9-.5L12 17.6l-1.8 3.9a1 1 0 0 1-.9.5H5.7a1 1 0 0 1-1-1.3l2.5-8.6c-2 .5-3.7.4-3.7-.9 0-1.7 2.7-3.4 5.6-4.3A3.3 3.3 0 0 1 12 2z"/>
    </symbol>
    <symbol id="i-arrivee" viewBox="0 0 24 24">
      <path d="M6 3v18M6 4h11l-2.5 4L17 12H6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-pause" viewBox="0 0 24 24">
      <path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-reprise" viewBox="0 0 24 24">
      <path d="M8 5.5v13l11-6.5z"/>
    </symbol>
    <symbol id="i-depart" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <header class="entete">
    <svg class="logo" aria-hidden="true"><use href="#i-pion"/></svg>
    <h1>Ludopointe</h1>
    <p class="horloge"><span id="date-jour"></span> · <span id="heure-actuelle"></span></p>
  </header>

  <main>
    <section class="carte" aria-label="Pointage">
      <p id="etat" class="etat" data-etat="absent" role="status"></p>
      <p id="compteur" class="compteur">0:00:00</p>
      <p class="legende">temps de travail net</p>
      <p id="resume" class="resume"></p>
      <p id="alerte" class="alerte" role="alert" hidden></p>

      <button id="action-principale" class="bouton principal" type="button"></button>

      <div id="zone-depart" class="zone-depart" hidden>
        <button id="depart" class="bouton discret" type="button">Pointer le départ</button>
        <div id="confirmation" class="confirmation" hidden>
          <button id="depart-confirmer" class="bouton depart" type="button">Confirmer le départ</button>
          <button id="depart-annuler" class="bouton discret" type="button">Annuler</button>
        </div>
      </div>
    </section>

    <section class="bloc" aria-labelledby="titre-pointages">
      <h2 id="titre-pointages">Pointages du jour</h2>
      <p id="pointages-vide" class="vide">Aucun pointage pour l’instant.</p>
      <ol id="pointages" class="parcours"></ol>
    </section>

    <details id="historique" class="bloc historique">
      <summary><h2>Historique</h2> <span id="historique-nb" class="compte"></span></summary>
      <p id="historique-vide" class="vide">Aucune journée terminée.</p>
      <ul id="historique-liste"></ul>
    </details>
  </main>

  <footer class="pied">
    <button id="installer" class="lien" type="button" hidden>Installer l’appli sur ce téléphone</button>
    <p id="installer-aide" class="vide" hidden>Dans Safari, touchez le bouton Partager, puis « Sur l’écran d’accueil ».</p>
  </footer>

  <noscript><p class="alerte">Ludopointe a besoin de JavaScript pour fonctionner.</p></noscript>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/installation.js"></script>
</body>
</html>
